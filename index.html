<style>
:root{
  --bg:#F2F3EE; --surface:#FFFFFF; --ink:#1C2218; --muted:#646B5B; --line:#D6DACC;
  --accent:#4A5A2B; --accent-ink:#FFFFFF; --chip:#E6E9DD; --tag:#EEF1E4;
  --ok:#2F6B2A; --ok-bg:#E1EFD9; --bad:#A3321F; --bad-bg:#F7E1DA; --warn:#8A5A00; --warn-bg:#F6EBCF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#141812; --surface:#1C211A; --ink:#E4E8DC; --muted:#9BA290; --line:#30372B;
    --accent:#A7BD74; --accent-ink:#141812; --chip:#252B22; --tag:#232A1F;
    --ok:#9ED08F; --ok-bg:#20331C; --bad:#F2A08E; --bad-bg:#3A1E17; --warn:#E6C06A; --warn-bg:#352A12;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#141812; --surface:#1C211A; --ink:#E4E8DC; --muted:#9BA290; --line:#30372B;
  --accent:#A7BD74; --accent-ink:#141812; --chip:#252B22; --tag:#232A1F;
    --ok:#9ED08F; --ok-bg:#20331C; --bad:#F2A08E; --bad-bg:#3A1E17; --warn:#E6C06A; --warn-bg:#352A12;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai",Tahoma,sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:18px 14px}
.eyebrow{font-size:13px;letter-spacing:.04em;color:var(--muted);margin:0}
h1{font-size:22px;margin:2px 0 12px;font-weight:700;text-wrap:balance}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:18px;padding:12px 44px 12px 44px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);outline:none}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);font-size:22px;width:32px;height:32px;border-radius:6px;cursor:pointer}
.clear:focus-visible,.chip:focus-visible,.try button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:4px 11px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding-block:14px 6px;color:var(--muted);font-size:14px}
.meta strong{color:var(--ink);font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.try{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.try button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--accent);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:2px 4px}
.unitsum{background:var(--tag);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:6px 0 4px;font-size:14px}
.unitsum b{font-weight:600}
.group{margin-top:18px}
.ghead{display:flex;align-items:baseline;gap:10px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.ghead h2{font-size:18px;margin:0}
.ghead span{font-size:13px;color:var(--muted)}
.row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1.2fr);gap:4px 16px;padding:10px 0;border-bottom:1px solid var(--line);align-items:baseline}
.dist{font-weight:600;font-size:17px}
.lbl{display:none;font-size:12px;color:var(--muted);margin-right:6px}
.plan{color:var(--muted)}
.unit{font-weight:500}
.colhead{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1.2fr);gap:16px;font-size:12px;color:var(--muted);padding-top:8px;letter-spacing:.02em}
.empty{padding:40px 0;text-align:center;color:var(--muted)}

.tabs{display:flex;gap:4px;margin:0 0 12px;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-size:15px;font-weight:600;background:transparent;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:6px 10px 8px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tab small{font-weight:500;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);margin-left:4px}
.pill{display:inline-block;font-size:12.5px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap;vertical-align:1px}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.unit .pill{margin-left:6px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:24px;line-height:1.2}
.stat span{font-size:13px;color:var(--muted)}
.stat.ok b{color:var(--ok)} .stat.bad b{color:var(--bad)}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--bad-bg);margin-top:10px}
.bar i{display:block;background:var(--ok)}
.barlbl{font-size:13px;color:var(--muted);margin-top:4px}
.krow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.kseq{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.kname{font-weight:600;font-size:17px}
.knums{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.klink{font:inherit;font-size:13px;border:0;background:transparent;color:var(--accent);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0;margin-left:8px}
.kright{text-align:right}
.note{font-size:13px;color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:8px 12px;margin-top:12px}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.krow{grid-template-columns:34px minmax(0,1fr)}.kright{grid-column:2;text-align:left}}
footer{padding-block:28px 40px;color:var(--muted);font-size:13px}
@media (max-width:560px){
  .row{grid-template-columns:1fr;gap:2px}
  .colhead{display:none}
  .lbl{display:inline}
  h1{font-size:19px}
}
</style>

const ROWS = RAW.map(([seq,mtb,prov,dist,plan,unit])=>{
  const key = norm([mtb,prov,dist,plan,unit].join(" "));
  return {seq,mtb,prov,dist,plan,unit,key};
});
function norm(s){return s.toLowerCase().replace(/[\s.,]/g,"").replace(/^เขต|^อำเภอ|^อ(?=[ก-ฮ])/,"")}
function termNorm(s){return s.toLowerCase().replace(/[\s.,]/g,"").replace(/^อำเภอ/,"").replace(/^จังหวัด/,"")}

const MTBS = [...new Set(ROWS.map(r=>r.mtb))];
const ukey=s=>s.replace(/[\s.,]/g,"").toLowerCase();
const KIT = KRAW.map(([seq,name,issued,got,off,ok])=>({seq,name,issued,got,off,ok,key:ukey(name)}));
function kpill(k){
  if(k.ok===k.got && k.got>0) return `<span class="pill ok">ใช้งานได้ ${k.ok}/${k.got}</span>`;
  if(k.ok===0) return `<span class="pill bad">งดใช้งาน ${k.off}/${k.got}</span>`;
  return `<span class="pill warn">ใช้งานได้ ${k.ok}/${k.got}</span>`;
}
let tab="area", kFilter="";
const $q = document.getElementById("q"), $list = document.getElementById("list"),
      $count = document.getElementById("count"), $chips = document.getElementById("chips"),
      $clear = document.getElementById("clear"), $unitsum = document.getElementById("unitsum");
let mtbFilter = "";

function buildChips(){
  if(tab==="area"){
    $chips.innerHTML=[["","ทั้งหมด"]].concat(MTBS.map(m=>[m,m])).map(([v,l])=>`<button class="chip" type="button" data-m="${v}" aria-pressed="${v===mtbFilter}">${l}</button>`).join("");
  }else{
    const nOff=KIT.filter(k=>k.off>0).length, nFull=KIT.filter(k=>k.off===0).length;
    $chips.innerHTML=[["","ทั้งหมด"],["off",`มีงดใช้งาน (${nOff})`],["full",`ใช้งานได้ครบ (${nFull})`]].map(([v,l])=>`<button class="chip" type="button" data-m="${v}" aria-pressed="${v===kFilter}">${l}</button>`).join("");
  }
}
$chips.addEventListener("click",e=>{
  const b=e.target.closest(".chip"); if(!b) return;
  if(tab==="area") mtbFilter=b.dataset.m; else kFilter=b.dataset.m;
  $chips.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c===b?"true":"false"));
  render();
});
function setTab(t2, query){
  tab=t2;
  document.getElementById("tab-area").setAttribute("aria-selected",tab==="area");
  document.getElementById("tab-kitchen").setAttribute("aria-selected",tab==="kitchen");
  document.getElementById("view-area").hidden=tab!=="area";
  document.getElementById("view-kitchen").hidden=tab!=="kitchen";
  document.getElementById("eyebrow").textContent=tab==="area"?"ทภ.1 · แผนบรรเทาสาธารณภัย กทม. และ 25 จังหวัดภาคกลาง":"ทภ.1 · สถานภาพ สป. รถครัวสนาม ชนิด 6 ล้อ";
  document.getElementById("title").textContent=tab==="area"?"ค้นหาพื้นที่และหน่วยรับผิดชอบ":"สถานภาพรถครัวสนาม 6 ล้อ";
  $q.placeholder=tab==="area"?"พิมพ์ เขต / อำเภอ / จังหวัด / หน่วย เช่น บางซื่อ, ร.12, ศบภ.ทอ.":"พิมพ์ชื่อหน่วย เช่น ร.12, บก.มทบ.14, ปตอ.";
  if(query!==undefined) $q.value=query;
  buildChips(); render(); window.scrollTo(0,0);
}

});

function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function render(){ if(tab==="kitchen") return renderKitchen(); renderArea(); }
function renderKitchen(){
  const raw=$q.value.trim(); $clear.hidden=!raw;
  const phrase=ukey(raw);
  const tot={issued:0,got:0,off:0,ok:0}; KIT.forEach(k=>{tot.issued+=k.issued;tot.got+=k.got;tot.off+=k.off;tot.ok+=k.ok});
  const pct=Math.round(tot.ok/tot.got*100);
  document.getElementById("kstats").innerHTML=`<div class="stat"><b>${KIT.length}</b><span>หน่วย</span></div><div class="stat"><b>${tot.issued}</b><span>คัน แจกจ่าย / ได้รับ ${tot.got}</span></div><div class="stat ok"><b>${tot.ok}</b><span>คัน ใช้งานได้</span></div><div class="stat bad"><b>${tot.off}</b><span>คัน งดใช้งาน</span></div>`;
  document.getElementById("kbar").innerHTML=`<div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div><div class="barlbl">ความพร้อมใช้งาน ${pct}% ของรถที่ได้รับจริง</div>`;
  const hits=KIT.filter(k=>{
    if(kFilter==="off" && !k.off) return false;
    if(kFilter==="full" && k.off) return false;
    return !phrase || k.key.includes(phrase);
  });
  const hOff=hits.reduce((s,k)=>s+k.off,0);
  document.getElementById("kcount").innerHTML=`แสดง <strong>${hits.length}</strong> หน่วย · งดใช้งาน <strong>${hOff}</strong> คัน`;
  if(!hits.length){document.getElementById("klist").innerHTML=`<div class="empty">ไม่พบหน่วย “${esc(raw)}” ลองพิมพ์สั้นลง หรือเลือก “ทั้งหมด”</div>`;return;}
  document.getElementById("klist").innerHTML=hits.map(k=>{
    return `<div class="krow"><div class="kseq">${k.seq}</div><div><div class="kname">${esc(k.name)}</div><div class="knums">แจกจ่าย ${k.issued} · ได้รับจริง ${k.got} · งดใช้งาน ${k.off} · ใช้งานได้ ${k.ok}</div></div><div class="kright">${kpill(k)}</div></div>`;
  }).join("");
}
function renderArea(){
  const raw=$q.value.trim();
  $clear.hidden=!raw;
  const terms=raw.split(/\s+/).filter(Boolean).map(termNorm).filter(Boolean);
  // keep multi-word unit codes like "ร.21 พัน.1" matchable as one phrase too
  const phrase=termNorm(raw);
  const hits=ROWS.filter(r=>{
    if(mtbFilter && r.mtb!==mtbFilter) return false;
    if(!phrase) return true;
    if(r.key.includes(phrase)) return true;
    return terms.every(t=>r.key.includes(t));
  });

  const provs=new Set(hits.map(r=>r.prov));
  $count.innerHTML=`พบ <strong>${hits.length}</strong> พื้นที่ ใน <strong>${provs.size}</strong> จังหวัด`;

  // summary when the query matches a responsible unit
  $unitsum.innerHTML="";
  if(phrase){
    const units={};
    hits.forEach(r=>{const u=norm(r.unit), p=norm(r.plan);
      if(u.includes(phrase)) (units[r.unit] ||= []).push(r.dist);
      else if(p.includes(phrase)) (units[r.plan] ||= []).push(r.dist);
    });
    const names=Object.keys(units);
    if(names.length && names.length<=4){
      $unitsum.innerHTML=names.map(n=>`<div class="unitsum"><b>${esc(n)}</b> รับผิดชอบ ${units[n].length} พื้นที่: ${units[n].map(esc).join(", ")}</div>`).join("");
    }
  }

  if(!hits.length){
    $list.innerHTML=`<div class="empty">ไม่พบ “${esc(raw)}” ลองพิมพ์สั้นลง เช่น ชื่ออำเภออย่างเดียว หรือเลือก “ทั้งหมด”</div>`;
    return;
  }
  const groups=new Map();
  hits.forEach(r=>{const k=r.seq; if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(r)});
  let html="";
  for(const [,g] of groups){
    const f=g[0];
    html+=`<section class="group"><div class="ghead"><h2>${esc(f.prov)}</h2><span>${esc(f.mtb)} · ${g.length} ${f.prov==="กรุงเทพมหานคร"?"เขต":"อำเภอ"}</span></div>
    <div class="colhead"><div>เขต/อำเภอ</div><div>แผนบรรเทาสาธารณภัย กห.</div><div>หน่วยรับผิดชอบตามนโยบาย ทบ.</div></div>`;
    for(const r of g){
      html+=`<div class="row"><div class="dist">${esc(r.dist)}</div><div class="plan"><span class="lbl">แผน กห.</span>${esc(r.plan)}</div><div class="unit"><span class="lbl">หน่วย ทบ.</span>${esc(r.unit)}</div></div>`;
    }
    html+=`</section>`;
  }
  $list.innerHTML=html;
}
buildChips();
if(location.hash==="#kitchen") setTab("kitchen"); else render();
